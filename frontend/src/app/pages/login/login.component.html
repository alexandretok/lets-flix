<div class="login-container">
  <div class="login-card">
    <div class="logo-section">
      <h1 class="logo-text">LetsFlix</h1>
      <p class="subtitle">Your personal streaming platform</p>
    </div>
    <div class="form-section">
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput [(ngModel)]="username" placeholder="Enter username" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="password" placeholder="Enter password" (keydown.enter)="onLogin()" />
        <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>
      <button mat-flat-button color="primary" (click)="onLogin()" [disabled]="authStore.loading()" class="w-full login-btn">
        @if (authStore.loading()) {
          <mat-icon class="spinning">sync</mat-icon>
        }
        Sign In
      </button>
    </div>
  </div>
</div>
