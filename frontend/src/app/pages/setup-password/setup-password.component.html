<div class="setup-container">
  <div class="setup-card">
    <div class="header-section">
      <h1 class="logo-text">LetsFlix</h1>
      <h2>Change Your Password</h2>
      <p class="info-text">You must set a new password before continuing.</p>
    </div>
    <div class="form-section">
      <mat-form-field appearance="outline">
        <mat-label>New Password</mat-label>
        <input matInput [type]="hideNew ? 'password' : 'text'" [(ngModel)]="newPassword" placeholder="Enter new password" />
        <button mat-icon-button matSuffix (click)="hideNew = !hideNew" type="button">
          <mat-icon>{{ hideNew ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Confirm Password</mat-label>
        <input matInput [type]="hideConfirm ? 'password' : 'text'" [(ngModel)]="confirmPassword" placeholder="Confirm password" (keydown.enter)="onChangePassword()" />
        <button mat-icon-button matSuffix (click)="hideConfirm = !hideConfirm" type="button">
          <mat-icon>{{ hideConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>
      <button mat-flat-button color="primary" (click)="onChangePassword()" [disabled]="loading" class="w-full setup-btn">
        @if (loading) {
          <mat-icon class="spinning">sync</mat-icon>
        }
        Set Password
      </button>
    </div>
  </div>
</div>
