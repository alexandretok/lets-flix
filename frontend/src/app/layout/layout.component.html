<div class="app-layout">
  <nav class="sidebar">
    <div class="sidebar-header">
      <h2 class="logo">LetsFlix</h2>
    </div>
    <ul class="nav-links">
      <li><a routerLink="/home" routerLinkActive="active"><mat-icon>home</mat-icon> Home</a></li>
      <li><a routerLink="/browse" routerLinkActive="active"><mat-icon>grid_view</mat-icon> My Catalog</a></li>
      <li><a routerLink="/search" routerLinkActive="active"><mat-icon>search</mat-icon> Search</a></li>
      <li><a routerLink="/settings" routerLinkActive="active"><mat-icon>settings</mat-icon> Settings</a></li>
      @if (authStore.isAdmin()) {
        <li><a routerLink="/downloads" routerLinkActive="active"><mat-icon>cloud_download</mat-icon> Downloads</a></li>
        <li><a routerLink="/users" routerLinkActive="active"><mat-icon>group</mat-icon> Users</a></li>
      }
    </ul>
    <div class="sidebar-footer">
      <div class="storage-section" [class.warning]="storageWarning">
        <div class="storage-header">
          <span class="storage-label">Storage</span>
          <span class="storage-free">{{ storageFree }} free</span>
        </div>
        <mat-progress-bar mode="determinate" [value]="storagePercent"></mat-progress-bar>
        <span class="storage-percent">{{ storagePercent }}%</span>
      </div>
      <div class="user-section">
        <span class="username"><mat-icon>person</mat-icon> {{ authStore.user()?.username }}</span>
        <button mat-icon-button (click)="logout()">
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </div>
  </nav>
  <main class="main-content">
    <router-outlet />
  </main>
</div>
